# yaml-language-server: $schema=../node_modules/sci2-ts/packages/content/room.schema.json
# Thorne's workshop, on the r34 room planes (art/studies/room-planes-r34): the shop floor,
# the work bay recessed behind its timber frame, the tall-case clock in the corner, all on
# the level, front-on camera the other rooms use. The floor, hotspots, approaches and
# layers follow its handoff (guides/handoff.json): the bench (136) and the bay's frame (138)
# stand in front of anyone behind them, the desk (199) in front of everyone. The picture
# has the passage behind the clock painted in; the clock's cel 0 covers it.
room: 102
picture: 102
music: 121
hero:
  at: [168, 176]
perspective: { horizon: 0, fullSize: 176 }
walkable: [[111, 160], [306, 160], [306, 195], [105, 195]]
features:
  # The three wall dials, all at seventeen past three.
  clocks: { rect: [98, 8, 228, 46], sightAngle: 360 }
  window: { rect: [12, 20, 67, 98], sightAngle: 360 }
  bench: { rect: [99, 66, 226, 135], sightAngle: 360 }
  lantern: { rect: [209, 80, 221, 98], sightAngle: 360 }
  ledger: { rect: [30, 149, 80, 175], sightAngle: 360 }
  # The way down, once the case is open (the closed clock covers it).
  stair: { rect: [244, 24, 286, 154], sightAngle: 360 }
props:
  # The lamp's light on the bench, flickering: the whole room, transparent but for the glow.
  light: { view: 220, at: [0, 0], cycle: forward }
  # The tall-case clock, closed; then the same clock as it swings open (from the reveal on).
  clock: { view: 221, at: [292, 150], sightAngle: 360 }
  caseDoor: { view: 221, at: [292, 150], sightAngle: 360 }
  # On the floor, under anyone walking over them.
  filings: { view: 227, at: [283, 175], sightAngle: 360 }
  scratches: { view: 228, at: [272, 164], sightAngle: 360 }
  watson: { view: 201, at: [128, 186], sightAngle: 360, scale: true }
characters:
  watson: { name: Watson, portrait: 210 }
properties:
  light: { cycleSpeed: 12, fixPriority: 1, priority: 130, clickable: 0 }
  caseDoor: { cycleSpeed: 9 }
  filings: { fixPriority: 1, priority: 155 }
  scratches: { fixPriority: 1, priority: 155 }
