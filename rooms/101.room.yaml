# yaml-language-server: $schema=../node_modules/sci2-ts/packages/content/room.schema.json
# Baker Street, on the r31 painting (art/studies/baker-street-r31): 221's door and steps at
# the left, the gas lamp on the pavement, the hansom turned across the road. The camera is
# the same level, front-on one as 221B's, and the floor, hotspots and route follow its
# handoff (guides/handoff.json).
room: 101
picture: 101
music: 120
hero:
  at: [44, 149]
  enterTo: [112, 176]
perspective: { horizon: 0, fullSize: 176 }
# The pavement and the road, around the cab's wheels.
walkable: [[30, 145], [111, 145], [111, 171], [160, 185], [227, 189], [251, 145], [312, 145], [312, 195], [30, 195]]
features:
  door221: { rect: [15, 29, 65, 133], sightAngle: 360 }
  cab: { rect: [120, 19, 250, 184], sightAngle: 360 }
props:
  # The lamp's flicker over the painted lamp; its post is in the picture's foreground.
  lamp: { view: 226, at: [99, 132], cycle: forward, sightAngle: 360 }
  watson: { view: 201, at: [282, 178], sightAngle: 360, scale: true }
characters:
  watson: { name: Watson, portrait: 210 }
properties:
  # Hit only where it's drawn.
  lamp: { checkPixels: 1, cycleSpeed: 27 }
