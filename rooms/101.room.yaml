# yaml-language-server: $schema=../node_modules/sci2-ts/packages/content/room.schema.json
# Baker Street, on the r19 painting: 221's door and steps at the left, the gas lamp on the
# pavement, the hansom waiting in the road.
room: 101
picture: 101
music: 120
hero:
  at: [55, 153]
  enterTo: [96, 162]
# Fitted to the painting: the railing tops and the kerb meet at y 123, and the gas lamp
# (about 3.3 m, its foot at y 158) puts a figure at full size with its feet at y 170.
# The camera is low and close, so the floor is a narrow band: lower down he'd fill the screen.
perspective: { horizon: 123, fullSize: 170 }
walkable: [[12, 151], [310, 150], [310, 172], [12, 172]]
obstacles:
  - [[100, 155], [113, 155], [113, 161], [100, 161]]
features:
  door221: { rect: [24, 30, 52, 134], sightAngle: 360 }
  cab: { rect: [160, 82, 310, 146], sightAngle: 360 }
props:
  # The lamp's flicker (view 226) over the painted lamp; its post is in the picture's foreground.
  lamp: { view: 226, at: [106, 158], cycle: forward, sightAngle: 360 }
  watson: { view: 201, at: [140, 164], sightAngle: 360, scale: true }
characters:
  watson: { name: Watson, portrait: 210 }
properties:
  # Above the foreground lamp post it overlays; hit only where it's drawn.
  lamp: { priority: 159, fixPriority: 1, checkPixels: 1, cycleSpeed: 10 }
