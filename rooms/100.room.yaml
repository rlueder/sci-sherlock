# yaml-language-server: $schema=../node_modules/sci2-ts/packages/content/room.schema.json
# 221B, the sitting room, on the r33 art (art/studies/221b-r33): the front room, a walnut
# opening and Holmes's chemistry room beyond it, all on the same level, front-on camera, so
# a figure's size depends only on how far down the screen its feet are. The floor, hotspots
# and positions follow its handoff (guides/handoff.json). The picture's layers put the
# opening (138), the armchair (146) and the desk (199) in front of whoever is behind them.
# The correspondence, the slipper and the violin are painted in by r43 (art/studies/
# environment-r43): the letters and slipper on and by the mantel, the violin on the desk.
room: 100
picture: 100
music: 120
hero:
  at: [205, 176]
perspective: { horizon: 0, fullSize: 176 }
# The front room's floor, short of the desk; no one walks into the back room.
walkable: [[120, 160], [300, 160], [308, 195], [99, 195], [105, 176]]
features:
  bench: { rect: [140, 59, 220, 119], sightAngle: 360 }
  correspondence: { rect: [26, 75, 42, 95], sightAngle: 360 }
  slipper: { rect: [53, 79, 66, 107], sightAngle: 360 }
  violin: { rect: [14, 161, 55, 183], sightAngle: 360 }
  window: { rect: [201, 26, 237, 76], sightAngle: 360 }
props:
  fire: { view: 222, at: [35, 133], cycle: forward, sightAngle: 360 }
  mantelLens: { view: 223, at: [48, 74], sightAngle: 360 }
  # Shut at cel 0; swings open over its ten cels, and the last is the open doorway.
  door: { view: 225, at: [315, 137], sightAngle: 360 }
  # Loop 0 sits still; loop 1 turns a page.
  watson: { view: 205, at: [93, 146], sightAngle: 360 }
  mrsHudson: { view: 202, at: [292, 163], moves: true, sightAngle: 360 }
  toby: { view: 203, at: [292, 163], moves: true, sightAngle: 360 }
  # The back room: fog at its window, its lamp and the steam off the bench.
  fog: { view: 280, at: [201, 26], cycle: forward }
  benchLamp: { view: 281, at: [207, 65], cycle: forward }
  steam: { view: 282, at: [156, 55], cycle: forward }
characters:
  watson: { name: Watson, portrait: 210 }
  mrsHudson: { name: Mrs Hudson, portrait: 211 }
  toby: { name: Toby, portrait: 212 }
properties:
  fire: { cycleSpeed: 7 }
  # Drawn on a canvas wide enough for its swing: hit only where it's drawn.
  door: { cycleSpeed: 7, checkPixels: 1 }
  # In his armchair: drawn after the chair's layer (146). Hit only where he's drawn, so the
  # slipper beside him can be clicked.
  watson: { cycleSpeed: 12, fixPriority: 1, priority: 147, checkPixels: 1 }
  # Behind the opening (138), and only there to look at: clicks go to the bench and window.
  fog: { cycleSpeed: 14, fixPriority: 1, priority: 110, clickable: 0 }
  benchLamp: { cycleSpeed: 14, fixPriority: 1, priority: 132, clickable: 0 }
  steam: { cycleSpeed: 14, fixPriority: 1, priority: 132, clickable: 0 }
