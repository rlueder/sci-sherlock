# yaml-language-server: $schema=../node_modules/sci2-ts/packages/content/room.schema.json
# 221B, the sitting room, on the r13 art (art/studies/baker-street-r13): the floor, hotspots
# and positions follow its scene and layout guides. The foreground layer (192) is the near
# furniture.
room: 100
picture: 100
music: 120
hero:
  at: [186, 176]
# Fitted to the painting rather than the r13 guide's camera (horizon y 72), which the painting
# doesn't follow: at that horizon Holmes by the door was half its height. The mantelpiece
# (about 1.3 m, its hearth at y 124), the door (its foot at y 152) and the figures at the
# front (full size at y 176) agree on a horizon above the screen, at about y -45.
perspective: { horizon: -45, fullSize: 176 }
# The floor stops short of the desk in the foreground, so feet never land on its top.
walkable: [[79, 151], [267, 148], [311, 150], [311, 193], [118, 193], [118, 164], [100, 154]]
features:
  correspondence: { rect: [117, 46, 134, 66], sightAngle: 360 }
  violin: { rect: [8, 102, 50, 136], sightAngle: 360 }
  bench: { rect: [208, 54, 270, 131], sightAngle: 360 }
  slipper: { rect: [184, 78, 198, 104], sightAngle: 360 }
  window: { rect: [8, 17, 71, 94], sightAngle: 360 }
props:
  fire: { view: 222, at: [158, 126], cycle: forward, sightAngle: 360 }
  mantelLens: { view: 223, at: [169, 68], sightAngle: 360 }
  # Shut at cel 0; opens over its six cels.
  door: { view: 225, at: [290, 145], sightAngle: 360 }
  watson: { view: 205, at: [95, 137], sightAngle: 360 }
  mrsHudson: { view: 202, at: [292, 152], moves: true, sightAngle: 360 }
  toby: { view: 203, at: [294, 154], moves: true, sightAngle: 360 }
characters:
  watson: { name: Watson, portrait: 210 }
  mrsHudson: { name: Mrs Hudson, portrait: 211 }
  toby: { name: Toby, portrait: 212 }
properties:
  fire: { cycleSpeed: 8 }
  # Drawn on a canvas wide enough for its swing: hit only where it's drawn.
  door: { cycleSpeed: 6, checkPixels: 1 }
