# yaml-language-server: $schema=../node_modules/sci2-ts/packages/content/room.schema.json
# 221B, the sitting room, on the r30 art (art/studies/221b-r30): painted to a level,
# front-on camera, so a figure's size depends only on how far down the screen its feet are.
# The floor, hotspots and positions follow its handoff (guides/handoff.json). The foreground
# layer (199) is the desk.
room: 100
picture: 100
music: 120
hero:
  at: [200, 176]
perspective: { horizon: 0, fullSize: 176 }
# The floor stops short of the desk in the foreground, so feet never land on its top.
walkable: [[112, 145], [299, 145], [308, 195], [104, 195], [104, 160], [112, 155]]
features:
  correspondence: { rect: [103, 47, 118, 73], sightAngle: 360 }
  violin: { rect: [15, 99, 58, 110], sightAngle: 360 }
  bench: { rect: [199, 83, 257, 143], sightAngle: 360 }
  slipper: { rect: [124, 93, 134, 128], sightAngle: 360 }
  window: { rect: [9, 16, 64, 108], sightAngle: 360 }
props:
  fire: { view: 222, at: [158, 141], cycle: forward, sightAngle: 360 }
  mantelLens: { view: 223, at: [160, 77], sightAngle: 360 }
  # Shut at cel 0; swings open over its ten cels, and the last is the open doorway.
  door: { view: 225, at: [313, 137], sightAngle: 360 }
  # Loop 0 sits still; loop 1 turns a page.
  watson: { view: 205, at: [94, 146], sightAngle: 360 }
  mrsHudson: { view: 202, at: [285, 148], moves: true, sightAngle: 360 }
  toby: { view: 203, at: [285, 148], moves: true, sightAngle: 360 }
characters:
  watson: { name: Watson, portrait: 210 }
  mrsHudson: { name: Mrs Hudson, portrait: 211 }
  toby: { name: Toby, portrait: 212 }
properties:
  fire: { cycleSpeed: 7 }
  # Drawn on a canvas wide enough for its swing: hit only where it's drawn.
  door: { cycleSpeed: 7, checkPixels: 1 }
  watson: { cycleSpeed: 12 }
